  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;

    background: #f5f0e8;

  /* FULL BG IMAGE */
  .bg-image {
    position: fixed;
    inset: 0;
    z-index: 0;

  .bg-glass {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: rgba(245,240,232,0.15);
    backdrop-filter: blur(2px);
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      to bottom,
      rgba(245,240,232,0.0) 0%,
      rgba(245,240,232,0.05) 50%,
      rgba(200,185,165,0.1) 100%
    );
  }

  /* COLOR WAVE ANIMATION */
  .bg-wave {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      180deg,
      rgba(212,195,170,0) 0%,
      rgba(212,195,170,0.25) 50%,
      rgba(180,160,130,0) 100%
    );
    background-size: 100% 200%;
    animation: waveFlow 6s ease-in-out infinite;
  }

  @keyframes waveFlow {
    0% { background-position: 0% 0%; opacity: 0.4; }
    50% { background-position: 0% 100%; opacity: 0.8; }
    100% { background-position: 0% 0%; opacity: 0.4; }
  }
